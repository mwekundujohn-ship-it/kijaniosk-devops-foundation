apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kijani-production
resources:
  - ../../base
configMapGenerator:
  - name: kk-payments-config
    literals:
      - NODE_ENV=production
      - PORT=3001
      - RECEIPTS_BUCKET=kk-payments-receipts-production-545572979505
      - LOG_LEVEL=info
    options:
      labels:
        app: kk-payments
images:
  - name: host.minikube.internal:5000/kk-payments
    newTag: 2.4.0-d8c32f4
replicas:
  - name: kk-payments
    count: 3
labels:
  - pairs:
      environment: production
    includeSelectors: true
