---
- name: Apply the KijaniKiosk staging overlay
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
    overlay: "{{ playbook_dir }}/../k8s/overlays/staging"

  tasks:
    - name: Check that the kubeconfig exists
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: kubeconfig_stat
      failed_when: not kubeconfig_stat.stat.exists

    - name: Apply the staging manifests
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} --context {{ kube_context }} apply -k {{ overlay }}"
      register: apply_result
      changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"

    - name: Wait for the staging rollout
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} --context {{ kube_context }} -n {{ staging_namespace }} rollout status deployment/kk-payments --timeout=180s"
      changed_when: false

    - name: Read the applied staging ConfigMap names
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} --context {{ kube_context }} -n {{ staging_namespace }} get configmap -l app=kk-payments -o name"
      register: configmaps
      changed_when: false

    - name: Show the staging ConfigMap names
      ansible.builtin.debug:
        var: configmaps.stdout_lines
